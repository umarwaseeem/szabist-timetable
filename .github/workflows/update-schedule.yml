name: Update schedule

on:
  schedule:
    # Pakistan is UTC+5. Fetch before the first class and again mid-morning
    # in case the board is corrected. 02:00 UTC = 07:00 PKT, 05:00 UTC = 10:00 PKT.
    - cron: '0 2 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run fetch
      - run: npm run fetch:programs
        continue-on-error: true
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: schedule for $(date -u +%F)"
          git push
